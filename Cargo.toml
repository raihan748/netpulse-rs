[package]
name = "netpulse-rs"
version = "0.1.0"
edition = "2021"
authors = ["Developer <developer@telkom.sch.id>"]
description = "Sub-millisecond network jitter, RTT latency & bufferbloat analyzer CLI"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
socket2 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
thiserror = "1.0"

[[bin]]
name = "netpulse"
path = "src/main.rs"

[lib]
name = "netpulse_rs"
path = "src/lib.rs"
